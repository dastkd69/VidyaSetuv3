<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidyasetu — Analysis</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/analysis.css">
</head>
<body>

    <!-- Tutorial overlay -->
    <div class="tutorial-overlay" id="tutorialOverlay"></div>
    <div class="tutorial-tooltip" id="tutorialTooltip">
        <div class="tutorial-arrow"></div>
        <div class="tutorial-header">
            <div class="tutorial-step-number" id="tutorialStepNumber"></div>
            <button class="tutorial-close" onclick="endTutorial()">×</button>
        </div>
        <div class="tutorial-title" id="tutorialTitle"></div>
        <div class="tutorial-description" id="tutorialDescription"></div>
        <div class="tutorial-footer">
            <div class="tutorial-nav">
                <button class="tutorial-nav-btn" onclick="prevTutorialStep()" id="tutorialPrevBtn">Previous</button>
                <button class="tutorial-nav-btn tutorial-next" onclick="nextTutorialStep()" id="tutorialNextBtn">Next</button>
            </div>
        </div>
    </div>

    <!-- ===== AI Tutor Modal ===== -->
    <div class="modal-backdrop" id="tutorModal">
        <div class="modal">

            <div class="modal-header">
                <div class="modal-header-left">
                    <div class="modal-title-row">
                        <div class="modal-ai-dot"></div>
                        <div class="modal-title">AI Tutor</div>
                    </div>
                    <div class="modal-topic-label" id="modalTopicLabel">—</div>
                </div>
                <button class="modal-close" onclick="closeTutorModal()">×</button>
            </div>

            <div class="modal-body" id="tutorBody">
                <!-- Conversation injected by JS -->
            </div>

            <div class="modal-footer">
                <textarea
                    class="modal-input"
                    id="modalInput"
                    rows="1"
                    placeholder="Ask a question about this topic…"
                ></textarea>
                <button class="modal-send-btn" id="modalSendBtn" onclick="sendTutorMessage()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Send
                </button>
            </div>

        </div>
    </div>
    <!-- ===== End Modal ===== -->

    <div class="app-container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <a class="logo" href="index.html">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    Vidyasetu
                </a>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" onclick="location.href='index.html'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    New Analysis
                </button>

                <div class="chat-history" id="chatHistory">
                    <!-- Populated dynamically with /api/chat/list -->
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="help-btn" onclick="restartTutorial()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    Tutorial
                </button>

                <a class="user-info" href="profile.html" title="View Profile" style="text-decoration:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--bg-elevated);cursor:pointer;transition:background 0.15s;">
                    <div class="user-avatar" id="userAvatar">P</div>
                    <div id="currentUser">Priya Kumar</div>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <!-- Rendered by analysis.js -->
                </div>
            </div>

            <!-- input-area hidden via CSS (no global chat bar anymore) -->
            <div class="input-area" id="inputArea"></div>
        </div>

    </div>

    <script src="js/shared.js"></script>
    <script src="js/analysis.js"></script>
    <script>
    // Load chat list into sidebar (reuses same API as home.js)
    async function loadChatListIntoSidebar() {
        try {
            const res = await fetch('/api/chat/list');
            if (!res.ok) return;
            const list = await res.json();
            const container = document.getElementById('chatHistory');
            if (!container) return;
            if (!list.length) {
                container.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;padding:8px 12px;">No previous analyses</div>';
                return;
            }
            // Keep chat list available for sidebar actions
            window.__VIDYASETU_CHAT_LIST__ = list;
            container.innerHTML = list.map(chat => `
                <div class="chat-item" data-chat-id="${chat.id}" onclick="openChatInSidebar('${chat.id}')">
                    <div class="chat-item-title">${chat.student_name}${chat.subject ? ' — ' + chat.subject : ''}</div>
                    <div class="chat-item-time">${chat.class_level ? 'Class ' + chat.class_level : ''}</div>
                </div>
            `).join('');
        } catch (e) {
            console.error('Failed to load chat list for sidebar:', e);
        }
    }
    document.addEventListener('DOMContentLoaded', loadChatListIntoSidebar);

// Called when user clicks a chat in the sidebar: store selected chat in sessionStorage and reload
function openChatInSidebar(chatId) {
    try {
        const list = window.__VIDYASETU_CHAT_LIST__ || [];
        const chat = list.find(c => c.id === chatId);
        if (!chat) return;
        // save selected chat so analysis.js can render it
        sessionStorage.setItem('vidyasetu_selected_chat', JSON.stringify(chat));
        // If chat has analyses, also pre-load the latest results for quick view
        if (Array.isArray(chat.analyses) && chat.analyses.length) {
            const last = chat.analyses[chat.analyses.length - 1];
            sessionStorage.setItem('vidyasetu_results', JSON.stringify({ chatId: chat.id, file_name: last.file_name, results: last.results }));
        }
        window.location.href = 'analysis.html';
    } catch (e) { console.error('openChatInSidebar error', e); }
}
    </script>
</body>
</html>
